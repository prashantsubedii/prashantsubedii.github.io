name: Update pinned projects

# Keeps assets/pinned.json in sync with the repositories pinned on the GitHub
# profile. The site (static GitHub Pages) reads that JSON, so pinning/unpinning
# a repo on GitHub updates the portfolio automatically — no third-party APIs.

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch: {}    # manual "Run workflow" button
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-pinned.yml'

permissions:
  contents: write

concurrency:
  group: update-pinned
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_USER: prashantsubedii
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned repositories via GraphQL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          QUERY=$(jq -n --arg login "$GH_USER" '{
            query: "query($login:String!){ user(login:$login){ pinnedItems(first:6, types:REPOSITORY){ nodes{ ... on Repository { name description url defaultBranchRef{ name } stargazerCount forkCount primaryLanguage{ name color } repositoryTopics(first:6){ nodes{ topic{ name } } } } } } } }",
            variables: { login: $login }
          }')

          RESP=$(curl -sS -X POST \
            -H "Authorization: bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$QUERY" \
            https://api.github.com/graphql)

          # Fail loudly if GraphQL returned errors or no nodes, so we never
          # overwrite a good pinned.json with an empty list.
          if echo "$RESP" | jq -e '.errors' >/dev/null 2>&1; then
            echo "GraphQL errors:"; echo "$RESP" | jq '.errors'; exit 1
          fi

          COUNT=$(echo "$RESP" | jq '.data.user.pinnedItems.nodes | length')
          echo "Pinned repositories found: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "No pinned repositories returned; leaving pinned.json unchanged."
            exit 0
          fi

          echo "$RESP" | jq --arg user "$GH_USER" '{
            updatedAt: (now | todateiso8601),
            note: "Auto-generated by .github/workflows/update-pinned.yml. Edit your pins on GitHub, not this file.",
            pinnedRepos: [ .data.user.pinnedItems.nodes[] | {
              name: .name,
              description: (.description // "No description available."),
              url: .url,
              defaultBranch: (.defaultBranchRef.name // "main"),
              openGraphImage: ("https://opengraph.githubassets.com/1/" + $user + "/" + .name),
              stars: .stargazerCount,
              forks: .forkCount,
              language: (.primaryLanguage.name // null),
              languageColor: (.primaryLanguage.color // null),
              topics: [ .repositoryTopics.nodes[].topic.name ]
            } ]
          }' > assets/pinned.json

          echo "Wrote assets/pinned.json:"
          cat assets/pinned.json

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/pinned.json; then
            echo "No changes to pinned.json."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pinned.json
          git commit -m "chore: sync pinned projects [skip ci]"
          git push
